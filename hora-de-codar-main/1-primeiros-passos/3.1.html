<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 3.1 - Bomba Relógio</title>
</head>
<body>

    <script>
        let contador = 30;

        // O laço executa enquanto o contador for maior ou igual a 0
        while (contador >= 0) {
            console.log(contador);
            document.write(contador + "<br>");
            
            // Decrementa 1 do contador a cada repetição
            contador--; 
        }

        console.log("EXPLOSÃO");
        document.write("<strong>EXPLOSÃO</strong>");
    </script>

</body>
</html>
