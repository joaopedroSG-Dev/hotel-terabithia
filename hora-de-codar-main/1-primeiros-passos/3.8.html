<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 3.8</title>
</head>
<body>

    <script>
        document.write("<h2>Os 10 primeiros números inteiros maiores que 100:</h2>");

        // O laço começa no primeiro número maior que 100 (101) e vai até 110
        for (let i = 101; i <= 110; i++) {
            console.log(i);
            document.write(i + "<br>");
        }
    </script>

</body>
</html>
