<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>
    var numero1 = parseFloat(prompt("digite o primeiro número"));
    var numero2 = parseFloat(prompt("digite o segundo número"));
    var numero3 = parseFloat(prompt("digite o terceiro número"));
    var numero4 = parseFloat(prompt("digite o quarto número"));
    var maior = Math.max(numero1, numero2, numero3, numero4);

   alert(`Primeiro valor digitado: ${numero1}
   Último valor digitado: ${numero4}
   O maior valor digitado: ${maior}`);
   
</script>

</body>
</html>
